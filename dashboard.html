<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMX - Accueil</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #111827;
            padding-bottom: 88px;
        }

        /* ==============================
           HEADER
        ============================== */

        .header {
            height: 64px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid #e5e7eb;
        }

        .brand {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .notification {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #f3f4f6;
            font-size: 19px;
            cursor: pointer;
        }

        /* ==============================
           CONTENT
        ============================== */

        .content {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 18px 15px 25px;
        }

        .welcome {
            margin-bottom: 17px;
        }

        .welcome small {
            display: block;
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .welcome h2 {
            margin: 0;
            font-size: 22px;
        }

        /* ==============================
           BMX CARD
        ============================== */

        .bank-card {
            position: relative;
            width: 100%;
            min-height: 205px;
            border-radius: 22px;
            padding: 22px;
            overflow: hidden;
            background: linear-gradient(
                135deg,
                #111827 0%,
                #1f2937 50%,
                #374151 100%
            );
            color: white;
            box-shadow: 0 12px 30px rgba(17, 24, 39, 0.22);
        }

        .bank-card::before {
            content: "";
            position: absolute;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            right: -80px;
            top: -80px;
            border: 35px solid rgba(255,255,255,0.06);
        }

        .bank-card::after {
            content: "";
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            left: -70px;
            bottom: -80px;
            background: rgba(255,255,255,0.04);
        }

        .card-top {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-brand {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .card-type {
            font-size: 11px;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        .card-user {
            position: relative;
            z-index: 2;
            margin-top: 23px;
        }

        .card-user-name {
            font-size: 17px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .card-phone {
            margin-top: 6px;
            font-size: 13px;
            opacity: 0.78;
        }

        .card-bottom {
            position: absolute;
            z-index: 2;
            left: 22px;
            right: 22px;
            bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .balance-label {
            font-size: 10px;
            opacity: 0.65;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .balance {
            font-size: 25px;
            font-weight: 800;
        }

        .currency {
            font-size: 12px;
            margin-left: 3px;
            font-weight: 500;
        }

        .chip {
            width: 42px;
            height: 31px;
            border-radius: 7px;
            background: linear-gradient(
                135deg,
                #d1d5db,
                #9ca3af
            );
            position: relative;
            overflow: hidden;
        }

        .chip::before,
        .chip::after {
            content: "";
            position: absolute;
            background: rgba(17,24,39,0.2);
        }

        .chip::before {
            width: 100%;
            height: 1px;
            top: 50%;
            left: 0;
        }

        .chip::after {
            height: 100%;
            width: 1px;
            left: 50%;
            top: 0;
        }

        /* ==============================
           ACTIONS
        ============================== */

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 17px;
        }

        .action-btn {
            height: 54px;
            border: none;
            border-radius: 13px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .deposit-btn {
            background: #111827;
            color: white;
        }

        .withdraw-btn {
            background: white;
            color: #111827;
            border: 1px solid #d1d5db;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* ==============================
           QUICK INFO
        ============================== */

        .section-title {
            margin: 26px 0 12px;
            font-size: 17px;
            font-weight: 800;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .info-box {
            background: white;
            border-radius: 15px;
            padding: 17px;
            border: 1px solid #e5e7eb;
        }

        .info-icon {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .info-title {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 17px;
            font-weight: 800;
        }

        /* ==============================
           BOTTOM NAVIGATION
        ============================== */

        .bottom-nav {
            position: fixed;
            z-index: 100;
            bottom: 0;
            left: 0;
            right: 0;
            height: 76px;
            background: rgba(255,255,255,0.97);
            border-top: 1px solid #e5e7eb;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding: 7px 5px;
            backdrop-filter: blur(10px);
        }

        .nav-item {
            border: none;
            background: transparent;
            color: #9ca3af;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }

        .nav-icon {
            font-size: 21px;
            line-height: 1;
        }

        .nav-item.active {
            color: #111827;
        }

        /* ==============================
           LOADING
        ============================== */

        .loading {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #d1d5db;
            border-top-color: #111827;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #6b7280;
            font-size: 14px;
        }

        /* ==============================
           MODAL NOTIFICATION
        ============================== */

        .modal {
            position: fixed;
            inset: 0;
            z-index: 500;
            background: rgba(0,0,0,0.45);
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 22px 22px 0 0;
            padding: 22px;
            animation: slideUp 0.2s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .close-modal {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: #f3f4f6;
            cursor: pointer;
            font-size: 17px;
        }

        .modal-text {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 380px) {

            .content {
                padding-left: 12px;
                padding-right: 12px;
            }

            .bank-card {
                min-height: 190px;
                padding: 18px;
            }

            .card-bottom {
                left: 18px;
                right: 18px;
                bottom: 17px;
            }

            .balance {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- ==============================
         LOADING
    ============================== -->

    <div class="loading" id="loading">

        <div class="spinner"></div>

        <div class="loading-text">
            Chargement de BMX...
        </div>

    </div>


    <!-- ==============================
         HEADER
    ============================== -->

    <header class="header">

        <div class="brand">
            BMX
        </div>

        <button
            class="notification"
            id="notificationBtn"
            type="button"
            aria-label="Notifications"
        >
            🔔
        </button>

    </header>


    <!-- ==============================
         MAIN
    ============================== -->

    <main class="content">

        <div class="welcome">

            <small>Bienvenue</small>

            <h2 id="welcomeName">
                Bonjour
            </h2>

        </div>


        <!-- ==============================
             CARTE BANCAIRE
        ============================== -->

        <section class="bank-card">

            <div class="card-top">

                <div class="card-brand">
                    BMX
                </div>

                <div class="card-type">
                    MEMBER CARD
                </div>

            </div>


            <div class="card-user">

                <div
                    class="card-user-name"
                    id="cardUserName"
                >
                    —
                </div>

                <div
                    class="card-phone"
                    id="cardPhone"
                >
                    —
                </div>

            </div>


            <div class="card-bottom">

                <div>

                    <div class="balance-label">
                        Solde disponible
                    </div>

                    <div class="balance">

                        <span id="balance">
                            0
                        </span>

                        <span class="currency">
                            FCFA
                        </span>

                    </div>

                </div>


                <div class="chip"></div>

            </div>

        </section>


        <!-- ==============================
             DEPOT / RETRAIT
        ============================== -->

        <div class="actions">

            <button
                type="button"
                class="action-btn deposit-btn"
                id="depositBtn"
            >
                ➕ Dépôt
            </button>

            <button
                type="button"
                class="action-btn withdraw-btn"
                id="withdrawBtn"
            >
                ➖ Retrait
            </button>

        </div>


        <!-- ==============================
             INFORMATIONS
        ============================== -->

        <h3 class="section-title">
            Mon espace
        </h3>

        <div class="info-grid">

            <div class="info-box">

                <div class="info-icon">
                    📈
                </div>

                <div class="info-title">
                    Investissement
                </div>

                <div class="info-value">
                    Voir mes investissements
                </div>

            </div>


            <div class="info-box">

                <div class="info-icon">
                    👥
                </div>

                <div class="info-title">
                    Équipe
                </div>

                <div class="info-value">
                    Mon parrainage
                </div>

            </div>

        </div>

    </main>


    <!-- ==============================
         MENU FIXE
    ============================== -->

    <nav class="bottom-nav">

        <button
            type="button"
            class="nav-item active"
            data-page="dashboard.html"
        >

            <span class="nav-icon">
                🏠
            </span>

            <span>
                Accueillir
            </span>

        </button>


        <button
            type="button"
            class="nav-item"
            data-page="investissement.html"
        >

            <span class="nav-icon">
                📈
            </span>

            <span>
                Investissement
            </span>

        </button>


        <button
            type="button"
            class="nav-item"
            data-page="equipe.html"
        >

            <span class="nav-icon">
                👥
            </span>

            <span>
                Équipe
            </span>

        </button>


        <button
            type="button"
            class="nav-item"
            data-page="profil.html"
        >

            <span class="nav-icon">
                👤
            </span>

            <span>
                Profil
            </span>

        </button>

    </nav>


    <!-- ==============================
         MODAL NOTIFICATION
    ============================== -->

    <div
        class="modal"
        id="notificationModal"
    >

        <div class="modal-box">

            <div class="modal-header">

                <h3>
                    Notifications
                </h3>

                <button
                    type="button"
                    class="close-modal"
                    id="closeModal"
                >
                    ✕
                </button>

            </div>

            <div class="modal-text">

                Aucune nouvelle notification pour le moment.

            </div>

        </div>

    </div>


    <script>

        // ==================================================
        // BMX DASHBOARD
        // ==================================================

        const TOKEN_KEY = "bmx_token";
        const USER_KEY = "bmx_user";


        // ==================================================
        // ELEMENTS
        // ==================================================

        const loading =
            document.getElementById("loading");

        const welcomeName =
            document.getElementById("welcomeName");

        const cardUserName =
            document.getElementById("cardUserName");

        const cardPhone =
            document.getElementById("cardPhone");

        const balance =
            document.getElementById("balance");

        const depositBtn =
            document.getElementById("depositBtn");

        const withdrawBtn =
            document.getElementById("withdrawBtn");

        const notificationBtn =
            document.getElementById("notificationBtn");

        const notificationModal =
            document.getElementById("notificationModal");

        const closeModal =
            document.getElementById("closeModal");


        // ==================================================
        // FORMATAGE DU SOLDE
        // ==================================================

        function formatMoney(value) {

            const number =
                Number(value || 0);

            return number.toLocaleString(
                "fr-FR",
                {
                    maximumFractionDigits: 0
                }
            );

        }


        // ==================================================
        // VERIFICATION CONNEXION
        // ==================================================

        function getUser() {

            const token =
                localStorage.getItem(TOKEN_KEY);

            const userData =
                localStorage.getItem(USER_KEY);


            if (!token || !userData) {

                window.location.href =
                    "login.html";

                return null;

            }


            try {

                return JSON.parse(userData);

            } catch (error) {

                console.error(
                    "Utilisateur invalide :",
                    error
                );

                localStorage.removeItem(USER_KEY);

                localStorage.removeItem(TOKEN_KEY);

                window.location.href =
                    "login.html";

                return null;

            }

        }


        // ==================================================
        // AFFICHAGE UTILISATEUR
        // ==================================================

        function displayUser(user) {

            const firstName =
                user.first_name || "";

            const lastName =
                user.last_name || "";

            const fullName =
                `${firstName} ${lastName}`.trim();


            welcomeName.textContent =
                `Bonjour ${firstName}`;


            cardUserName.textContent =
                fullName || "Utilisateur BMX";


            cardPhone.textContent =
                user.phone || "—";


            balance.textContent =
          formatMoney(user.balance);

        }


        // ==================================================
        // NAVIGATION
        // ==================================================

        document
            .querySelectorAll(".nav-item")
            .forEach(function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        const page =
                            button.dataset.page;

                        if (!page) {
                            return;
                        }

                        if (
                            page ===
                            "dashboard.html"
                        ) {
                            return;
                        }

                        window.location.href =
                            page;

                    }
                );

            });


        // ==================================================
        // DEPOT
        // ==================================================

        depositBtn.addEventListener(
            "click",
            function() {

                window.location.href =
                    "deposit.html";

            }
        );


        // ==================================================
        // RETRAIT
        // ==================================================

        withdrawBtn.addEventListener(
            "click",
            function() {

                window.location.href =
                    "withdraw.html";

            }
        );


        // ==================================================
        // NOTIFICATIONS
        // ==================================================

        notificationBtn.addEventListener(
            "click",
            function() {

                notificationModal.classList.add(
                    "show"
                );

            }
        );


        closeModal.addEventListener(
            "click",
            function() {

                notificationModal.classList.remove(
                    "show"
                );

            }
        );


        notificationModal.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    notificationModal
                ) {

                    notificationModal.classList.remove(
                        "show"
                    );

                }

            }
        );


        // ==================================================
        // INITIALISATION
        // ==================================================

        function initDashboard() {

            const user =
                getUser();


            if (!user) {
                return;
            }


            displayUser(user);


            // Retirer l'écran de chargement

            setTimeout(
                function() {

                    loading.style.display =
                        "none";

                },
                250
            );

        }


        // ==================================================
        // START
        // ==================================================

        initDashboard();

    </script>

</body>
</html>
